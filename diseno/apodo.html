<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elige tu apodo</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <main class="contenido">
    <h1 class="titulo">Elige tu apodo</h1>
    <p class="aviso">¡Vas a recibir 1.000 de aura para empezar!</p>
    <form class="formulario" action="lobby.html" method="post">
      <label class="formulario__etiqueta" for="apodo">Apodo</label>
      <input class="formulario__campo" type="text" id="apodo" name="apodo">
      <button class="boton" type="submit">Continuar</button>
    </form>
  </main>
</body>
</html>
