<!DOCTYPE html>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

</head>
<body>
  <header class="barra">
    <a class="barra__logo" href="lobby.html">Minijuegos</a>

  <main class="contenido">
    <h1 class="titulo">Configuración</h1>

    <form class="formulario" action="configuracion.html" method="post">
      <label class="formulario__etiqueta" for="apodo">Apodo</label>
      <input class="formulario__campo" type="text" id="apodo" name="apodo" value="Jugador1">

      <button class="boton" type="submit">Guardar</button>
    </form>

    <form class="formulario" action="index.html" method="post">
      <button class="boton" type="submit" name="cerrar">Cerrar sesión</button>
      <button class="boton boton--peligro" type="submit" name="borrar">Borrar cuenta</button>
    </form>
